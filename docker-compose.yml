services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-usermgmt}
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d usermgmt"]
      interval: 5s
      timeout: 3s
      retries: 10
  api:
    build: .
    env_file:
      - .env
    environment:
      APP_ADDR: ${APP_ADDR:-:8080}
      DATABASE_URL: ${DATABASE_URL_DOCKER:-postgres://app:app@db:5432/usermgmt?sslmode=disable}
      JWT_SECRET: ${JWT_SECRET:-replace-this-with-a-random-secret-at-least-32-characters}
      ACCESS_TOKEN_TTL: ${ACCESS_TOKEN_TTL:-15m}
      REFRESH_TOKEN_TTL: ${REFRESH_TOKEN_TTL:-720h}
      PERMISSION_CACHE_TTL: ${PERMISSION_CACHE_TTL:-30s}
      DB_MAX_CONNS: ${DB_MAX_CONNS:-30}
    expose:
      - "8080"
    depends_on:
      db:
        condition: service_healthy
  proxy:
    image: nginx:1.29-alpine
    ports:
      - "8080:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_started
volumes:
  postgres_data:
