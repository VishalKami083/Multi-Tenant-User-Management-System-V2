openapi: 3.0.3
info:
  title: Multi-Tenant User Management API
  version: 1.0.0
  description: >-
    Tenant-scoped user, role, permission, authentication, and audit APIs.
    Protected operations derive tenant identity from the signed access token;
    callers cannot select a tenant in a request.
servers:
  - url: http://localhost:8080
    description: Local development
tags:
  - name: Health
  - name: Tenants
  - name: Authentication
  - name: Users
  - name: Memberships
  - name: Roles
  - name: Permissions
  - name: Audit
paths:
  /healthz:
    get:
      tags: [Health]
      summary: Check service health
      operationId: healthCheck
      security: []
      responses:
        '200':
          description: The service is healthy
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    example: ok
  /api/v1/tenants:
    post:
      tags: [Tenants]
      summary: Create a tenant and its initial administrator
      description: Creates the tenant, owner, admin role, and initial role assignments atomically.
      operationId: createTenant
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTenantRequest'
      responses:
        '201':
          description: Tenant and owner created
          content:
            application/json:
              schema:
                type: object
                required: [tenant, owner]
                properties:
                  tenant:
                    $ref: '#/components/schemas/Tenant'
                  owner:
                    $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/auth/login:
    post:
      tags: [Authentication]
      summary: Log in to a tenant
      description: >-
        Failed attempts for known tenants are added to the tenant audit log
        without storing the submitted email or password.
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Access and refresh tokens issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/auth/refresh:
    post:
      tags: [Authentication]
      summary: Rotate a refresh token
      operationId: refreshToken
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: The previous refresh token was rotated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/auth/logout:
    post:
      tags: [Authentication]
      summary: Revoke a refresh token
      operationId: logout
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '204':
          description: Refresh token revoked
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/tenant:
    get:
      tags: [Tenants]
      summary: Get the authenticated tenant
      operationId: getTenant
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Tenant details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tenant'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    patch:
      tags: [Tenants]
      summary: Update the authenticated tenant
      description: All fields are optional; omitted or empty fields retain their current values.
      operationId: updateTenant
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTenantRequest'
      responses:
        '200':
          description: Updated tenant
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tenant'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/users:
    get:
      tags: [Users]
      summary: List active users in the authenticated tenant
      operationId: listUsers
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
        - name: search
          in: query
          description: Case-insensitive match against the membership display name or email.
          schema:
            type: string
      responses:
        '200':
          description: Paginated tenant users
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Users]
      summary: Create a user and add them to the authenticated tenant
      operationId: createUser
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
      responses:
        '201':
          description: User created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/users/{userID}:
    parameters:
      - $ref: '#/components/parameters/UserID'
    get:
      tags: [Users]
      summary: Get a user in the authenticated tenant
      operationId: getUser
      security:
        - bearerAuth: []
      responses:
        '200':
          description: User details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Users]
      summary: Update a user's tenant-specific display name
      operationId: updateUser
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name]
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 160
      responses:
        '200':
          description: Updated user membership details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Users]
      summary: Soft-delete a user's membership in this tenant
      operationId: deleteUser
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Membership soft-deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/memberships:
    post:
      tags: [Memberships]
      summary: Add an existing user to the authenticated tenant
      operationId: addMembership
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [user_id]
              properties:
                user_id:
                  type: string
                  format: uuid
      responses:
        '201':
          description: Membership created or reactivated
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/memberships/{userID}:
    patch:
      tags: [Memberships]
      summary: Suspend or reactivate a user membership
      description: >-
        Requires membership:update. Changes access in the authenticated tenant
        without deleting the membership or changing the user's memberships in
        other tenants. An administrator cannot suspend their own membership,
        which prevents accidental self-lockout.
      operationId: updateMembership
      security:
        - bearerAuth: []
      parameters:
        - name: userID
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [status]
              properties:
                status:
                  type: string
                  enum: [active, suspended]
      responses:
        '204':
          description: Membership status updated
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/roles:
    get:
      tags: [Roles]
      summary: List roles in the authenticated tenant
      operationId: listRoles
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Tenant roles
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Role'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Roles]
      summary: Create a role in the authenticated tenant
      operationId: createRole
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRoleRequest'
      responses:
        '201':
          description: Role created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Role'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/permissions:
    get:
      tags: [Permissions]
      summary: List the permission catalog
      operationId: listPermissions
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Permission catalog
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Permission'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/users/{userID}/roles:
    parameters:
      - $ref: '#/components/parameters/UserID'
    post:
      tags: [Roles]
      summary: Assign a role to a tenant user
      operationId: assignRole
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [role_id]
              properties:
                role_id:
                  type: string
                  format: uuid
      responses:
        '204':
          description: Role assigned
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/users/{userID}/roles/{roleID}:
    parameters:
      - $ref: '#/components/parameters/UserID'
      - $ref: '#/components/parameters/RoleID'
    delete:
      tags: [Roles]
      summary: Remove a role assignment from a tenant user
      operationId: removeRole
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Role assignment removed
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/roles/{roleID}/permissions:
    parameters:
      - $ref: '#/components/parameters/RoleID'
    put:
      tags: [Roles, Permissions]
      summary: Replace a role's complete permission set
      operationId: setRolePermissions
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [permissions]
              properties:
                permissions:
                  type: array
                  maxItems: 100
                  uniqueItems: true
                  items:
                    type: string
                    pattern: '^[a-z][a-z0-9_-]*:[a-z][a-z0-9_-]*$'
      responses:
        '204':
          description: Role permission set replaced
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/audit-logs:
    get:
      tags: [Audit]
      summary: List audit entries for the authenticated tenant
      operationId: listAuditLogs
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Tenant audit entries
          content:
            application/json:
              schema:
                type: object
                required: [items, limit, offset]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/AuditEntry'
                  limit:
                    type: integer
                  offset:
                    type: integer
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    UserID:
      name: userID
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RoleID:
      name: roleID
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Limit:
      name: limit
      in: query
      description: Page size (default 20, maximum 100).
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Offset:
      name: offset
      in: query
      description: Number of entries to skip.
      schema:
        type: integer
        minimum: 0
        default: 0
  responses:
    BadRequest:
      description: Invalid JSON, validation failure, or invalid related resource
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Unauthorized:
      description: Missing or invalid authentication, credentials, or refresh token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Forbidden:
      description: Authenticated user lacks the required permission
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    NotFound:
      description: Resource not found in the authenticated tenant
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Conflict:
      description: Resource conflicts with an existing record
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
  schemas:
    CreateTenantRequest:
      type: object
      additionalProperties: false
      required: [name, code, owner_name, email, password]
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 160
        code:
          type: string
          minLength: 2
          maxLength: 63
          pattern: '^[a-z0-9][a-z0-9-]*$'
        owner_name:
          type: string
          minLength: 1
          maxLength: 160
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 12
          maxLength: 72
          description: Password length is measured in bytes by the server.
    LoginRequest:
      type: object
      additionalProperties: false
      required: [tenant_code, email, password]
      properties:
        tenant_code:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
          format: password
    RefreshRequest:
      type: object
      additionalProperties: false
      required: [refresh_token]
      properties:
        refresh_token:
          type: string
    UpdateTenantRequest:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 160
        code:
          type: string
          minLength: 2
          maxLength: 63
          pattern: '^[a-z0-9][a-z0-9-]*$'
        status:
          type: string
          enum: [active, suspended]
    CreateUserRequest:
      type: object
      additionalProperties: false
      required: [name, email, password]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 160
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 12
          maxLength: 72
          description: Password length is measured in bytes by the server.
    CreateRoleRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 80
        description:
          type: string
          maxLength: 500
    Tenant:
      type: object
      required: [id, name, code, status]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        code:
          type: string
        status:
          type: string
          enum: [active, suspended]
    User:
      type: object
      required: [id, name, email, created_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
          format: email
        created_at:
          type: string
          format: date-time
    UserPage:
      type: object
      required: [items, limit, offset, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/User'
        limit:
          type: integer
        offset:
          type: integer
        total:
          type: integer
    Role:
      type: object
      required: [id, name, description]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
    Permission:
      type: object
      required: [name, description]
      properties:
        name:
          type: string
          pattern: '^[a-z][a-z0-9_-]*:[a-z][a-z0-9_-]*$'
        description:
          type: string
    TokenPair:
      type: object
      required:
        - access_token
        - refresh_token
        - token_type
        - access_expires_at
        - refresh_expires_at
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        token_type:
          type: string
          example: Bearer
        access_expires_at:
          type: string
          format: date-time
        refresh_expires_at:
          type: string
          format: date-time
    AuditEntry:
      type: object
      required: [id, actor_id, action, target_type, target_id, details, created_at]
      properties:
        id:
          type: integer
          format: int64
        actor_id:
          type: string
          format: uuid
          nullable: true
        action:
          type: string
        target_type:
          type: string
        target_id:
          type: string
        details:
          type: object
          additionalProperties: true
        created_at:
          type: string
          format: date-time
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
